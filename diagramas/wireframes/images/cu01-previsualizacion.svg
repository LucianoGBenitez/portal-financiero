<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="768" viewBox="0 0 1365 768" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .bg { fill:#fff }
      .card { fill:#fff; stroke:#dcdcdc; stroke-width:1 }
      .panel { fill:#f6f6f6; stroke:#d1d1d1; stroke-width:1 }
      .header { font-size:20px; font-weight:700; fill:#222 }
      .subtitle { font-size:12px; fill:#666 }
      .kpi-label { font-size:11px; fill:#666 }
      .kpi-value { font-size:16px; font-weight:700; fill:#111 }
      .table-head { fill:#efefef; stroke:#e0e0e0; stroke-width:1 }
      .muted { fill:#888; font-size:12px }
      .ok { fill:#27ae60; font-size:12px }
      .warn { fill:#c0392b; font-size:12px }
      .btn-primary { fill:#222; stroke:#222 }
      .btn-primary-text { fill:#fff; font-weight:700; font-size:13px }
      .btn-secondary { fill:#fff; stroke:#bdbdbd }
      .btn-secondary-text { fill:#333; font-size:13px }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1365" height="768"/>

  <!-- Header -->
  <g transform="translate(32,24)">
    <text class="header" x="0" y="0">Generación de Transferencias Masivas (TEF)</text>
    <text class="subtitle" x="0" y="26">Paso 3 de 4 — Previsualización de planilla con errores</text>

    <!-- Stepper -->
    <g transform="translate(680, -4)">
      <rect x="0" y="2" width="520" height="32" rx="4" class="panel" />
      <g fill="#777" font-size="12">
        <rect x="6" y="8" width="120" height="18" rx="3" fill="#fff" stroke="#d1d1d1"/>
        <text x="14" y="20">1. Carga</text>
        <rect x="136" y="8" width="120" height="18" rx="3" fill="#fff" stroke="#d1d1d1"/>
        <text x="144" y="20">2. Mapeo</text>
        <rect x="266" y="8" width="140" height="18" rx="3" fill="#222" stroke="#222"/>
        <text x="278" y="20" fill="#fff">3. Previsualización</text>
        <rect x="416" y="8" width="100" height="18" rx="3" fill="#fff" stroke="#d1d1d1"/>
        <text x="426" y="20">4. Confirmación</text>
      </g>
    </g>
  </g>

  <!-- KPI Cards -->
  <g transform="translate(32,80)">
    <g transform="translate(0,0)">
      <rect class="card" x="0" y="0" width="300" height="60" rx="6" />
      <text class="kpi-label" x="14" y="20">Total filas</text>
      <text class="kpi-value" x="14" y="44">128</text>
    </g>
    <g transform="translate(320,0)">
      <rect class="card" x="0" y="0" width="300" height="60" rx="6" />
      <text class="kpi-label" x="14" y="20">Válidas</text>
      <text class="kpi-value" x="14" y="44">120</text>
    </g>
    <g transform="translate(640,0)">
      <rect class="card" x="0" y="0" width="300" height="60" rx="6" />
      <text class="kpi-label" x="14" y="20">Con error</text>
      <text class="kpi-value" x="14" y="44">8</text>
    </g>
    <g transform="translate(960,0)">
      <rect class="card" x="0" y="0" width="320" height="60" rx="6" />
      <text class="kpi-label" x="14" y="20">Importe total</text>
      <text class="kpi-value" x="14" y="44">$ 4.512.300</text>
    </g>
  </g>

  <!-- Controls -->
  <g transform="translate(32,160)">
    <rect x="0" y="0" width="500" height="40" rx="6" class="panel" />
    <g transform="translate(12,26)" font-size="13" fill="#333">
      <rect x="-8" y="-14" width="18" height="18" rx="3" fill="#fff" stroke="#bdbdbd"/>
      <text x="12" y="0">Mostrar solo filas con error</text>
    </g>

    <g transform="translate(520,6)">
      <rect x="0" y="0" width="320" height="28" rx="4" fill="#fff" stroke="#d1d1d1" />
      <text x="12" y="18" class="muted">🔍 Buscar por CUIT / nombre</text>
    </g>
  </g>

  <!-- Table -->
  <g transform="translate(32,220)">
    <!-- Table head -->
    <rect class="table-head" x="0" y="0" width="1260" height="36" rx="2"/>
    <g font-size="13" fill="#333">
      <text x="12" y="24">Fila</text>
      <text x="72" y="24">CBU</text>
      <text x="360" y="24">CUIT</text>
      <text x="500" y="24">Nombre</text>
      <text x="900" y="24">Importe</text>
      <text x="1000" y="24">Estado</text>
    </g>

    <!-- Rows: example 1 (valid) -->
    <g transform="translate(0,44)">
      <rect x="0" y="0" width="1260" height="40" fill="#fff" stroke="#eee"/>
      <text x="12" y="26">1</text>
      <text x="72" y="26">007099903000456</text>
      <text x="360" y="26">20304050607</text>
      <text x="500" y="26">ACME SA</text>
      <text x="900" y="26">$120.000</text>
      <text x="1000" y="26" class="ok">✅ Válido</text>
    </g>

    <!-- Rows: example 2 (error - CBU inválido) -->
    <g transform="translate(0,96)">
      <rect x="0" y="0" width="1260" height="40" fill="#fff" stroke="#f2dede"/>
      <!-- subtle dash border effect -->
      <rect x="0" y="0" width="1260" height="40" fill="none" stroke="#f2dede" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="12" y="26">2</text>
      <text x="72" y="26">007099903000456</text>
      <text x="360" y="26">20304050608</text>
      <text x="500" y="26">LOPEZ SRL</text>
      <text x="900" y="26">$85.000</text>
      <text x="1000" y="26" class="warn">⚠️ CBU inválido (21 dígitos)</text>
    </g>

    <!-- Rows: example 3 (error - CUIT inválido) -->
    <g transform="translate(0,148)">
      <rect x="0" y="0" width="1260" height="40" fill="#fff" stroke="#f2dede"/>
      <rect x="0" y="0" width="1260" height="40" fill="none" stroke="#f2dede" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="12" y="26">3</text>
      <text x="72" y="26">0070999030004567</text>
      <text x="360" y="26">203040506</text>
      <text x="500" y="26">PEREZ J.</text>
      <text x="900" y="26">$45.000</text>
      <text x="1000" y="26" class="warn">⚠️ CUIT inválido</text>
    </g>

    <!-- filler rows -->
    <g transform="translate(0,200)" fill="#999" font-size="12">
      <text x="12" y="20">...</text>
    </g>
  </g>

  <!-- Note + Actions -->
  <g transform="translate(32,520)">
    <text class="note" x="0" y="0">Las filas marcadas con error no se incluirán en el archivo TEF.</text>

    <!-- Buttons -->
    <g transform="translate(0,24)">
      <rect class="btn-secondary" x="0" y="10" width="160" height="36" rx="6"/>
      <text class="btn-secondary-text" x="24" y="34">Volver al mapeo</text>

      <rect class="btn-primary" x="220" y="10" width="220" height="36" rx="6"/>
      <text class="btn-primary-text" x="280" y="34">Confirmar y generar TEF</text>
    </g>
  </g>

  <!-- Accessibility note -->
  <g transform="translate(32,650)">
    <text class="muted" x="0" y="0">Accesibilidad: estados combinan ícono + texto (no depender solo del color).</text>
  </g>
</svg>
